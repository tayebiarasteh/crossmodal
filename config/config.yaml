CrossModal:
  mimic_master_csv: /PATH.csv
  mimic_image_root: /PATH
  mimic_reports_root: /PATH
  chexpert_master_csv: /PATH.csv
  chexpert_reports_csv: /PATH.csv
  chexpert_image_root: /PATH

  batch_size: 32
  num_workers: 10
  max_text_tokens_clip_pubmed: 77
  max_text_tokens_biovilt: 512
  temperature: 0.07

  base_seed: 20260222
  n_trials_settingA: 20
  n_trials_settingB: 10
  n_bootstrap: 1000
  settingB_N: 10000
  feature_cache_batch_size: 64

Network:
  weight_decay: 0.01
  amsgrad: false
  num_epochs: 150

network_output_path: network_data/
output_data_path: output_data/
tb_logs_path: tensor_board_logs/
stat_log_path: stat_logs
checkpoint_name: checkpoint.tar
trained_model_name: trained_model.pth
DP_checkpoint_name: DP_checkpoint.tar

# changeable items:
file_path: /PATH
target_dir: /PATH/crossmodal
display_stats_freq: 1 # valid freq is equal to this

DP:
  epsilon: 11
  delta: 6e-6
  max_grad_norm: 1.5
  logical_batch_size: 128
  physical_batch_size: 64
  gn_num_groups: 32